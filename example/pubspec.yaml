name: flutter_ad_plugin_example
description: "Example app for the modular Flutter ad packages"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_ad_core:
    path: ../packages/flutter_ad_core
  flutter_ad_admob:
    path: ../packages/flutter_ad_admob
  flutter_ad_max:
    path: ../packages/flutter_ad_max
  flutter_ad_topon:
    path: ../packages/flutter_ad_topon
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
